<rect x="70" y="400" width="290" height="31" rx="8" fill="#1e3a8a"/>
<text x="84" y="421" font-size="13" font-weight="700" fill="#ffffff">P15: Fixed periodic sweep</text>
<text x="84" y="462" font-size="12" fill="#334155">Whether it sees the ZZZ body</text>
